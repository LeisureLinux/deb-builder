name: Build Go Deb Packages

# 注意：不要在 on.push 里同时写 paths 和 tags —— GitHub 对这些过滤条件取交集(AND)，
# 普通 branch push 没有 tag，永远满足不了 tags:['v*']，导致整个 push 触发器失效。
# 因此这里用裸 push（branch/tag 都触发），由各 job 按 ref 条件自行分流。
on:
  push:
  pull_request:
    paths: ['recipes/*.yaml', 'scripts/']
  workflow_dispatch:                    # 手动触发（可指定单个 package，空=全量）
    inputs:
      package:
        description: '要构建的包名 (如 gdu)。留空则全量构建所有 recipes'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-changed:
    # 仅 main 的 branch push 或 pull_request 时构建本次被改动的 recipe；tag push 走 build-all
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      # 按架构拆到各自的 runner 上原生构建（原因同 receive-trigger.yml：
      # cgo 包交叉链接需要目标架构的开发包，x64 runner 上编不出 arm64 的产物）。
      matrix:
        include:
          - runner: ubuntu-latest           # x86_64 原生
            arch: amd64
          - runner: ubuntu-24.04-arm        # aarch64 原生（公开仓库免费）
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # 与 receive-trigger.yml 保持同一套依赖，否则 PR 检查跑的环境和真正发布的
      # 环境不一致，cgo / eBPF / rust 类的包会在这里失败而在那边成功（或反过来）。
      - name: Install build dependencies
        run: |
          EXTRA=""
          if [ "${{ matrix.arch }}" = "amd64" ]; then EXTRA="gcc-aarch64-linux-gnu"; fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq $EXTRA protobuf-compiler liblzma-dev libssl-dev \
            libglib2.0-dev libnetfilter-queue-dev pkg-config clang >/dev/null
          sudo apt-get install -y -qq "linux-headers-$(uname -r)" \
            || sudo apt-get install -y -qq linux-headers-generic \
            || echo "⚠️ 内核头文件安装失败，eBPF 类包本次可能构建不出来"
          command -v cargo >/dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Detect and build changed recipes
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'recipes/*.yaml' \
                     | xargs -r -n1 basename | sed 's/\.yaml$//' | sort -u)
          if [[ -z "$CHANGED" ]]; then
            echo "ℹ️ no changed recipes"
            exit 0
          fi
          echo "📦 Changed packages: $CHANGED"
          while read -r pkg; do
            echo "    building: $pkg (arch=${{ matrix.arch }})"
            ARCHS_OVERRIDE=${{ matrix.arch }} bash scripts/build-one.sh "$pkg" || { echo "❌ $pkg failed"; exit 1; }
          done <<< "$CHANGED"
          echo "✅ All changed packages built (arch=${{ matrix.arch }})"

  build-all:
    # tag 全量构建，或手动触发（package 为空=全量，非空=单个）
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest           # x86_64 原生
            arch: amd64
          - runner: ubuntu-24.04-arm        # aarch64 原生（公开仓库免费）
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install build dependencies
        run: |
          EXTRA=""
          if [ "${{ matrix.arch }}" = "amd64" ]; then EXTRA="gcc-aarch64-linux-gnu"; fi
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq $EXTRA protobuf-compiler liblzma-dev libssl-dev \
            libglib2.0-dev libnetfilter-queue-dev pkg-config clang >/dev/null
          sudo apt-get install -y -qq "linux-headers-$(uname -r)" \
            || sudo apt-get install -y -qq linux-headers-generic \
            || echo "⚠️ 内核头文件安装失败，eBPF 类包本次可能构建不出来"
          command -v cargo >/dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build single package (manual dispatch, package given)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package != '' }}
        run: |
          ARCHS_OVERRIDE=${{ matrix.arch }} bash scripts/build-one.sh "${{ github.event.inputs.package }}"

      - name: Build all recipes (tag / manual empty dispatch)
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.package != '') }}
        run: |
          ARCHS_OVERRIDE=${{ matrix.arch }} bash scripts/build-all.sh
