name: Build Go Deb Packages

on:
  push:
    paths: ['recipes/*.yaml']            # branch push 时只构建被改动的包
    tags:
      - 'v*'                            # tag：为所有 recipe 全量重建
  pull_request:
    paths: ['recipes/*.yaml', 'scripts/']
  workflow_dispatch:                    # 手动触发（可指定单个 package，空=全量）
    inputs:
      package:
        description: '要构建的包名 (如 gdu)。留空则全量构建所有 recipes'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-changed:
    # 仅 branch push 或 pull_request 时构建本次被改动的 recipe；tag push 走 build-all
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Detect and build changed recipes
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'recipes/*.yaml' \
                     | xargs -r -n1 basename | sed 's/\.yaml$//' | sort -u)
          if [[ -z "$CHANGED" ]]; then
            echo "ℹ️ no changed recipes"
            exit 0
          fi
          echo "📦 Changed packages: $CHANGED"
          while read -r pkg; do
            echo "    building: $pkg"
            # 仅构建 amd64+arm64（loong64/riscv64 临时禁用，声明保留在 recipe 注释中）
            ARCHS_OVERRIDE=amd64,arm64 bash scripts/build-one.sh "$pkg" || { echo "❌ $pkg failed"; exit 1; }
          done <<< "$CHANGED"
          echo "✅ All changed packages built"

  build-all:
    # tag 全量构建，或手动触发（package 为空=全量，非空=单个）
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build single package (manual dispatch, package given)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package != '' }}
        run: |
          bash scripts/build-one.sh "${{ github.event.inputs.package }}"

      - name: Build all recipes (tag / manual empty dispatch)
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.package != '') }}
        run: |
          # 仅构建 amd64+arm64（loong64/riscv64 临时禁用，声明保留在 recipe 注释中）
          ARCHS_OVERRIDE=amd64,arm64 bash scripts/build-all.sh
