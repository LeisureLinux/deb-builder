name: Restore incoming database

# 一次性修复：2026-08-25 的 incoming 清理误删了作为仓库数据库的全部历史 .deb。
# 从 apt-repo 的 git 历史按时间顺序恢复所有出现过的 incoming/*.deb，
# 提交后触发 publish 重建完整 APT 仓库。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-incoming
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full clone of apt-repo (history contains all debs)
        env:
          BUILDER_PAT: ${{ secrets.BUILDER_PAT }}
        run: |
          git config --global user.name "Deb Builder Bot"
          git config --global user.email "deb-builder@leisurelinux.org"
          # 完整历史克隆（.deb 都在 git 对象里，体积大但必要）；跨仓库写入需 BUILDER_PAT
          git clone "https://x-access-token:${BUILDER_PAT}@github.com/LeisureLinux/apt-repo.git" /tmp/apt-repo
          cd /tmp/apt-repo
          echo "== apt-repo 提交总数: $(git rev-list --count HEAD) =="

      - name: Restore all historical debs into incoming/
        run: |
          cd /tmp/apt-repo
          mkdir -p incoming
          FOUND=0
          for sha in $(git rev-list --reverse HEAD); do
            msg=$(git log -1 --format='%s' "$sha" || true)
            case "$msg" in
              *"add built .deb"*|*"for auto"*)
                echo "♻️  restore from ${sha:0:8} ($msg)"
                git restore --source="$sha" -- incoming/ || true
                FOUND=$((FOUND+1)) ;;
            esac
          done
          echo "== 恢复结果 =="
          echo "匹配快照数: $FOUND; deb 文件数: $(ls incoming/*.deb 2>/dev/null | wc -l)"
          du -sh incoming/

      - name: Commit and trigger publish
        env:
          BUILDER_PAT: ${{ secrets.BUILDER_PAT }}
        run: |
          cd /tmp/apt-repo
          # 注意：.gitignore 忽略 incoming/*.deb，必须 -f 强制添加；
          # 用 --cached diff 判断真实变化，不能用 git status（会漏掉 ignored 文件）
          git add -f incoming/*.deb
          if ! git diff --cached --numstat | grep -q .; then
            echo "ℹ️ 数据库与远端一致，无需提交"
            exit 0
          fi
          echo "== 待提交变更 =="
          git diff --cached --stat | tail -2
          git commit -m "restore: rebuild incoming/ package database from history"
          for attempt in 1 2 3; do
            git pull --rebase origin main 2>/dev/null || true
            if git push origin main; then echo "✅ pushed"; break; fi
            sleep $((RANDOM % 8 + 3))
          done
          gh api repos/LeisureLinux/apt-repo/dispatches -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $BUILDER_PAT" \
            -f event_type=publish \
            -f 'client_payload[package]=__all__' \
            -f 'client_payload[success]=true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
