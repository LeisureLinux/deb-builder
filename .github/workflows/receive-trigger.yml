name: Receive Auto-Build Triggers

on:
  repository_dispatch:
    types: [auto-build-required]

  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build (e.g., gdu, ripgrep)'
        required: false

jobs:
  receive-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine package from event
        id: pkg
        run: |
          # Prefer client_payload.package (sent by debian-auto-builder scanner),
          # then fall back to the workflow_dispatch input, else auto mode.
          CLIENT_PKG="${{ github.event.client_payload.package }}"
          INPUT_PKG="${{ inputs.package }}"

          if [ -n "$CLIENT_PKG" ] && [ "$CLIENT_PKG" != "null" ]; then
            echo "pkg_name=$CLIENT_PKG" >> "$GITHUB_OUTPUT"
            echo "📦 Building package: $CLIENT_PKG (from repository_dispatch)"
          elif [ -n "$INPUT_PKG" ] && [ "$INPUT_PKG" != "null" ]; then
            echo "pkg_name=$INPUT_PKG" >> "$GITHUB_OUTPUT"
            echo "📦 Building package: $INPUT_PKG (from workflow_dispatch)"
          else
            echo "pkg_name=auto" >> "$GITHUB_OUTPUT"
            echo "🔍 Auto mode: building all recipes"
          fi

      - name: Build all recipes (auto mode)
        if: steps.pkg.outputs.pkg_name == 'auto'
        run: |
          bash scripts/build-all.sh

      - name: Build specific package
        if: steps.pkg.outputs.pkg_name != 'auto'
        run: |
          bash scripts/build-one.sh "${{ steps.pkg.outputs.pkg_name }}"

      - name: Dispatch to apt-repo after build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && steps.pkg.outputs.pkg_name != ''
        run: |
          PKG="${{ steps.pkg.outputs.pkg_name }}"
          curl -X POST https://api.github.com/repos/LeisureLinux/apt-repo/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "{\"event_type\":\"build-complete\",\"client_payload\":{\"package\":\"${PKG}\",\"success\":\"true\"}}"
