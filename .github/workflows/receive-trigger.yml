name: Receive Auto-Build Triggers

on:
  repository_dispatch:
    types: [auto-build-required]

  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build (e.g., gdu, ripgrep)'
        required: false
      arches:
        description: 'Optional comma-separated arch override (e.g., amd64,arm64); empty = use recipe target_arches'
        required: false
        default: ''

# 并发控制：
# - 全量构建（auto 模式）共用 deb-builder-auto 组，新运行会取消旧的进行中/排队的全量运行，
#   避免 scanner 一次派发多个重复全量任务。
# - 单包构建（repository_dispatch 或 workflow_dispatch 指定包名）按包名分组，
#   不同包可并行；同一包重复触发时排队执行、不取消，避免漏建。
concurrency:
  group: deb-builder-${{ github.event.client_payload.package || inputs.package || 'auto' }}
  cancel-in-progress: ${{ (github.event.client_payload.package || '') == '' && (inputs.package || '') == '' }}

jobs:
  receive-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine package from event
        id: pkg
        run: |
          # Prefer client_payload.package (sent by debian-auto-builder scanner),
          # then fall back to the workflow_dispatch input, else auto mode.
          CLIENT_PKG="${{ github.event.client_payload.package }}"
          INPUT_PKG="${{ inputs.package }}"
          echo "arches=${{ inputs.arches }}" >> "$GITHUB_OUTPUT"

          if [ -n "$CLIENT_PKG" ] && [ "$CLIENT_PKG" != "null" ]; then
            echo "pkg_name=$CLIENT_PKG" >> "$GITHUB_OUTPUT"
            echo "📦 Building package: $CLIENT_PKG (from repository_dispatch)"
          elif [ -n "$INPUT_PKG" ] && [ "$INPUT_PKG" != "null" ]; then
            echo "pkg_name=$INPUT_PKG" >> "$GITHUB_OUTPUT"
            echo "📦 Building package: $INPUT_PKG (from workflow_dispatch)"
          else
            echo "pkg_name=auto" >> "$GITHUB_OUTPUT"
            echo "🔍 Auto mode: building all recipes"
          fi

      - name: Build all recipes (auto mode)
        if: steps.pkg.outputs.pkg_name == 'auto'
        env:
          # 临时仅构建发布 amd64+arm64；loong64/riscv64 暂不构建
          # （声明仍保留在 recipe 的 target_arches 注释中，后续可启用）
          ARCHS_OVERRIDE: amd64,arm64
        run: |
          # cgo/rust recipe 需要：交叉编译器、protoc、C 头文件；cargo 由 runner 预装（缺失则装 rustup）
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu protobuf-compiler liblzma-dev libssl-dev libglib2.0-dev libnetfilter-queue-dev pkg-config >/dev/null
          command -v cargo >/dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; }
          export PATH="$HOME/.cargo/bin:$PATH"
          # 大包编译（如 yq）内存峰值高，7GB runner 易被 OOM killer 静默击杀，加 swap 兜底
          sudo fallocate -l 6G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -h
          bash scripts/build-all.sh

      - name: Build specific package
        if: steps.pkg.outputs.pkg_name != 'auto'
        env:
          # 默认只建 amd64+arm64；可用 workflow_dispatch 的 arches 输入覆盖
          ARCHS_OVERRIDE: ${{ steps.pkg.outputs.arches || 'amd64,arm64' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu protobuf-compiler liblzma-dev libssl-dev libglib2.0-dev libnetfilter-queue-dev pkg-config >/dev/null
          command -v cargo >/dev/null || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; }
          export PATH="$HOME/.cargo/bin:$PATH"
          sudo fallocate -l 6G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          rc=0
          bash scripts/build-one.sh "${{ steps.pkg.outputs.pkg_name }}" || rc=$?
          # exit 2 = recipe 已禁用，属正常跳过
          if (( rc == 2 )); then echo "⏭️ 已禁用，跳过"; exit 0; fi
          exit $rc

      # Option 2: push the built .deb files directly into apt-repo's incoming/,
      # then dispatch its publish workflow to sign + publish to GitHub Pages.
      - name: Push .deb to apt-repo and trigger publish
        env:
          BUILDER_PAT: ${{ secrets.BUILDER_PAT }}
        run: |
          set -euo pipefail
          PKG="${{ steps.pkg.outputs.pkg_name }}"
          WS="$GITHUB_WORKSPACE"

          ls -lh "$WS"/dist/*.deb 2>/dev/null || { echo "❌ no .deb artifacts found in dist/"; exit 1; }

          # 1~4. 推送到 apt-repo（带重试：并行构建同时 push 会产生非快进冲突）
          PUSH_OK=0
          for attempt in 1 2 3 4 5; do
            cd "$WS"   # 关键：先离开旧目录再删除，否则 cwd 失效导致后续 git 操作全部报错
            rm -rf /tmp/apt-repo
            git clone --depth 1 \
              "https://x-access-token:${BUILDER_PAT}@github.com/LeisureLinux/apt-repo.git" \
              /tmp/apt-repo
            cd /tmp/apt-repo
            git config user.name "Deb Builder Bot"
            git config user.email "deb-builder@leisurelinux.org"
            mkdir -p incoming
            cp "$WS"/dist/*.deb incoming/
            git add -f incoming/*.deb   # incoming/*.deb is gitignored; force-add
            if git diff --cached --quiet; then
              echo "ℹ️ no new .deb artifacts to commit (already in incoming/)"
              PUSH_OK=1; break
            fi
            git commit -m "auto: add built .deb for ${PKG}"
            if git push origin main; then
              echo "✅ pushed (attempt $attempt)"
              PUSH_OK=1; break
            fi
            echo "⚠️ push rejected (attempt $attempt), will re-clone and retry..."
            sleep $((RANDOM % 8 + 3))   # 随机退避，错开并发窗口
          done
          (( PUSH_OK == 1 )) || { echo "❌ failed to push to apt-repo after retries"; exit 1; }

          # 5. Dispatch publish workflow on apt-repo
          curl -X POST https://api.github.com/repos/LeisureLinux/apt-repo/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $BUILDER_PAT" \
            -d "{\"event_type\":\"publish\",\"client_payload\":{\"package\":\"${PKG}\",\"success\":\"true\"}}"
