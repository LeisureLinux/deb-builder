# xepub —— EPUB reader for Linux desktops (Python + GTK3 + WebKitGTK 4.1, XApp)
#
# 纯 Python + meson 项目，Architecture: all（无需编译，只由 amd64 构建线产出）。
# 上游自带 debian/ 目录（Maintainer: Clement Lefebvre），这里走 deb-builder 自建
# +LL 版本规则，依赖对齐上游 debian/control 的 Depends。
#
# 构建方式：meson setup --prefix=/usr → meson compile → DESTDIR=包根 meson install
# （见 scripts/pkgs/xepub.sh）。gnome.post_install 会编译 gschema、刷新图标缓存，
# 这两个生成的缓存文件在打包时被移除，交给目标系统的 dpkg trigger 重算（Debian 惯例）。
repo: xapp-project/xepub
package: xepub
summary: "Secure, paginated EPUB reader for the Linux desktop"
description: |
  Xepub is a secure, comfortable, paginated EPUB reader for the Linux desktop.
  It is an XApp, so it works in any desktop environment and any distribution.
  Built with Python, PyGObject, GTK 3, XApp and WebKitGTK 4.1, it enforces a
  strict Content-Security-Policy on book resources for safe reading.
homepage: https://github.com/xapp-project/xepub
section: utils

# 版本：上游 meson.build version=1.0.1，tag v1.0.1。
# 用最新 master（含 debian/control 的 build-depends 更新）；自建走 +LL 规则。
version_tag: "v1.0.1"
latest_tag: "v1.0.1"
commit_hash: "e7124ca7764def957e764c9d8af9aac5aee38881"
upstream_version: "1.0.1"

# arch: all（纯 Python）。只由 amd64 构建线负责产出；arm64 runner 因不在
# target_arches 内干净跳过（exit 2），避免同名 _all.deb 在两台 runner 上撞车。
target_arches:
  - amd64

maintainer: "LeisureLinux <albertxu@freelamp.com>"

# 运行期依赖：对照上游 debian/control 的 Depends。
#   python3:any 允许任意架构的 python3 解释器（arch:all 包推荐写法）。
depends:
  - gir1.2-gtk-3.0
  - gir1.2-webkit2-4.1
  - python3:any
  - python3-gi
  - python3-xapp
  - python3-setproctitle

# 只发 trixie（与 opensnitch 套件一致，先保证依赖可解析、范围好控）。
# 注：gir1.2-webkit2-4.1 + python3-xapp 在 bookworm/noble 同样可得，
#     若想扩大覆盖范围，把下面改成 [trixie, bookworm] 之类即可（需各 suite 验证）。
suites:
  - trixie

build_script: scripts/pkgs/xepub.sh
