# unregistry 构建配方 (Go 项目, 上游 psviderski/unregistry)
# 来自 debian.griffo.io 第三方源的迁移：上游发布，我们从源码构建后发布到
# repo.freelamp.com，避免依赖第三方源。Go 静态二进制（CGO_ENABLED=0），
# 不依赖发行版 glibc，bookworm/trixie 通用。
repo: psviderski/unregistry
package: unregistry
summary: "A container image registry that stores images in containerd's content store"
description: |
  A container image registry that stores images in containerd's content store
  Built from source by deb-builder and published to repo.freelamp.com.
  Statically linked Go binary (CGO disabled), works across Debian/Ubuntu releases.
homepage: https://github.com/psviderski/unregistry
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v0.4.3"
latest_tag: "v0.4.3"
commit_hash: "75f5b35683980a7cb3811645ef7ee0cfe3d64c00"
upstream_version: "0.4.3"

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
