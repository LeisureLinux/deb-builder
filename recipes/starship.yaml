# starship 构建配方 (Rust 项目, 上游 starship/starship) —— musl 全静态
# 来自 debian.griffo.io 第三方源的迁移：我们从源码构建后发布到
# repo.freelamp.com。musl 全静态不依赖发行版 glibc，bookworm/trixie 通用。
repo: starship/starship
package: starship
summary: "The minimal, blazing-fast, and infinitely customizable prompt for any shell"
description: |
  The minimal, blazing-fast, and infinitely customizable prompt for any shell
homepage: https://github.com/starship/starship
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v1.26.0"
latest_tag: "v1.26.0"
commit_hash: "fca92d8dcbd5981b0160af2f7ed7a430b6475a72"
upstream_version: "1.26.0"

# musl 全静态构建（scripts/pkgs/rust-musl.sh，与 yazi/zoxide 同一套）
build_script: scripts/pkgs/rust-musl.sh
rust_bins:
  - starship

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
