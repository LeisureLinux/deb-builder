# trivy 构建配方 (第五批补齐)
repo: aquasecurity/trivy
package: trivy
summary: "Find vulnerabilities, misconfigurations, secrets in containers and IaC"
description: |
  Trivy is a comprehensive security scanner for containers, filesystems, git repos and cloud environments.
homepage: https://github.com/aquasecurity/trivy
section: admin

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v0.75.0"
latest_tag: "v0.75.0"
commit_hash: "591e9799316a602e703f0b484f6c6d7b234ec8f3"
upstream_version: "0.75.0"

# Go 构建配置
ldflags: "-s -w"
# trivy 使用 Go 1.25+ 实验性 encoding/json/v2，需要 GOEXPERIMENT
build_env: "GOEXPERIMENT=jsonv2"

# 构建入口（自动检测不可靠的显式指定）
build_path: "./cmd/trivy"

target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
