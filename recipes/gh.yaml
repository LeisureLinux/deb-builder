# gh 构建配方 (第五批补齐)
repo: cli/cli
package: gh
summary: "GitHub's official command-line tool"
description: |
  gh is GitHub's official command-line tool for pull requests, issues and other GitHub concepts.
homepage: https://github.com/cli/cli
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v2.103.2"
latest_tag: "v2.103.2"
commit_hash: "4f2cfe92e3499f8581bf39db77e0a1431fa7b55c"
upstream_version: "2.103.2"

# Go 构建配置
ldflags: "-s -w"

# 构建入口（自动检测不可靠的显式指定）
build_path: "./cmd/gh"

target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
