# television 构建配方 (Rust 项目, 上游 alexpasmantier/television) —— musl 全静态
# 来自 debian.griffo.io 第三方源的迁移：我们从源码构建后发布到
# repo.freelamp.com。musl 全静态不依赖发行版 glibc，bookworm/trixie 通用。
repo: alexpasmantier/television
package: television
summary: "A blazingly fast general purpose fuzzy finder TUI"
description: |
  A blazingly fast general purpose fuzzy finder TUI
homepage: https://github.com/alexpasmantier/television
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "0.15.9"
latest_tag: "0.15.9"
commit_hash: "b17cdfaa43c7e1300d52d2660fc9793a1fda7e21"
upstream_version: "0.15.9"

# musl 全静态构建（scripts/pkgs/rust-musl.sh，与 yazi/zoxide 同一套）
build_script: scripts/pkgs/rust-musl.sh
rust_bins:
  - tv

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
