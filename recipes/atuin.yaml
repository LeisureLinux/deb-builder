# atuin 构建配方 (Rust 项目, 上游 atuinsh/atuin) —— musl 全静态
# 来自 debian.griffo.io 第三方源的迁移：我们从源码构建后发布到
# repo.freelamp.com。musl 全静态不依赖发行版 glibc，bookworm/trixie 通用。
repo: atuinsh/atuin
package: atuin
summary: "Magical shell history"
description: |
  Magical shell history
homepage: https://github.com/atuinsh/atuin
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v18.22.0"
latest_tag: "v18.22.0"
commit_hash: "f98361cf8d33326fb70e7a242ff37a58845f5173"
upstream_version: "18.22.0"

# musl 全静态构建（scripts/pkgs/rust-musl.sh，与 yazi/zoxide 同一套）
build_script: scripts/pkgs/rust-musl.sh
rust_bins:
  - atuin
rust_package: atuin
# musl 静态链接必须：默认 features 里的 sync 会拉 openssl-sys，
# 系统 libssl-dev 是 glibc 的，musl 目标链不上。vendored-tls 让 openssl
# 从源码编译并静态链进去（上游为打包场景专门提供的 feature）。
rust_features: vendored-tls

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
