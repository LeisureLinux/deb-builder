# terragrunt 构建配方 (第五批补齐)
repo: gruntwork-io/terragrunt
package: terragrunt
summary: "Terragrunt is a thin wrapper for Terraform"
description: |
  Terragrunt provides extra tools for keeping Terraform configurations DRY, working with multiple Terraform modules, and managing remote state.
homepage: https://github.com/gruntwork-io/terragrunt
section: devel

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v1.1.4"
latest_tag: "v1.1.4"
commit_hash: "50598628d992d3790afc8596594af2468903f140"
upstream_version: "1.1.4"

# Go 构建配置
ldflags: "-s -w"

# 构建入口（自动检测不可靠的显式指定）
build_path: "."

target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
