# viu 构建配方 (Rust 项目, 上游 atanunq/viu) —— musl 全静态
# 来自 debian.griffo.io 第三方源的迁移：我们从源码构建后发布到
# repo.freelamp.com。musl 全静态不依赖发行版 glibc，bookworm/trixie 通用。
repo: atanunq/viu
package: viu
summary: "Simple terminal image viewer"
description: |
  Simple terminal image viewer
homepage: https://github.com/atanunq/viu
section: graphics

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v1.6.1"
latest_tag: "v1.6.1"
commit_hash: "5733be5f8b18c54495123725e7f13cc5ec23ee68"
upstream_version: "1.6.1"

# musl 全静态构建（scripts/pkgs/rust-musl.sh，与 yazi/zoxide 同一套）
build_script: scripts/pkgs/rust-musl.sh
rust_bins:
  - viu

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
