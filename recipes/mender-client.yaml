# mender-client 构建配方 (Phase 1 自动生成)
repo: mendersoftware/mender
package: mender-client
summary: "Mender over-the-air software updater client."
description: |
  Mender over-the-air software updater client.
  (Phase 1 auto-built for all architectures.)
homepage: https://github.com/mendersoftware/mender
section: devel

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "5.1.0"
latest_tag: "5.1.0"
# mender 4.x 起改为 C++ 实现；Go 版客户端止于 3.5.2
commit_hash: "54d57fc32abd0bb1a8f0336d6d5ab624d3c5ac49"
upstream_version: "5.1.0"

# Go 构建配置
ldflags: "-s -w"

# vendored C 依赖（liblzma、openssl）需要系统头文件；
# arm64 交叉编译需完整 multiarch sysroot，CI 暂只支持 amd64
target_arches:
  - amd64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []

# 需要 cgo（vendored lmdb C 代码）
cgo: true
