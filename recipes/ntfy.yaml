# ntfy 构建配方 (Phase 1 自动生成)
repo: binwiederhier/ntfy
package: ntfy
summary: "Send push notifications to your phone or desktop"
description: |
  Send push notifications to your phone or desktop
  (Phase 1 auto-built for all architectures.)
homepage: https://github.com/binwiederhier/ntfy
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v2.27.0"
latest_tag: "v2.27.0"
commit_hash: "4c2b69e0591b51d7ed7b2e71954f0f7be936b47f"
upstream_version: "2.27.0"

# Go 构建配置
ldflags: "-s -w"

# 全架构打包
target_arches:
  - amd64
  - arm64
#   - loong64  # 临时禁用: loong64/riscv64 暂不构建，声明保留待用
#   - riscv64  # 临时禁用: loong64/riscv64 暂不构建，声明保留待用

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []

# server 包 go:embed site/docs 目录由 make 生成；CI 用占位符保证二进制可构建（web 界面不含在内）
pre_build: "mkdir -p server/site server/docs && printf '<html><body>ntfy (docs/web assets not included in this build)</body></html>' > server/docs/index.html && cp server/docs/index.html server/site/index.html"
# web/docs 资源未嵌入，运行时相关页面为占位页
