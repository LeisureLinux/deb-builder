# go-bluetooth 构建配方 (Phase 1 自动生成)
repo: muka/go-bluetooth
package: go-bluetooth
summary: "Golang bluetooth client based on bluez DBus interfaces (program)"
description: |
  Golang bluetooth client based on bluez DBus interfaces (program)
  (Phase 1 auto-built for all architectures.)
homepage: https://github.com/muka/go-bluetooth
section: golang

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "1.0.0"
latest_tag: "1.0.0"
commit_hash: "c37f45f4ed51656e61dda499c33f7e2f98fa4e12"
upstream_version: "1.0.0"

# Go 构建配置
ldflags: "-s -w"

# 全架构打包
target_arches:
  - amd64
  - arm64
#   - loong64  # 临时禁用: loong64/riscv64 暂不构建，声明保留待用
#   - riscv64  # 临时禁用: loong64/riscv64 暂不构建，声明保留待用

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []

# 库仓库无单一主程序；发布 btmgmt 蓝牙管理工具作为二进制
build_path: "./examples/btmgmt"
# 依赖修复：Sirupsen 大小写改名；go-systemd 升到 v22；godbus 同步升 v5（API 兼容）
pre_build: 'grep -rl "github.com/Sirupsen/logrus" --include="*.go" . | xargs -r sed -i "s#github\.com/Sirupsen/logrus#github.com/sirupsen/logrus#g"; grep -rl "github.com/coreos/go-systemd" --include="*.go" . | xargs -r sed -i "s#github\.com/coreos/go-systemd/dbus#github.com/coreos/go-systemd/v22/dbus#g"; grep -rl "github.com/godbus/dbus" --include="*.go" . | xargs -r sed -i "s#github\.com/godbus/dbus/v5#XXX_KEEP_V5_XXX#g; s#github\.com/godbus/dbus#github.com/godbus/dbus/v5#g; s#XXX_KEEP_V5_XXX#github.com/godbus/dbus/v5#g"'
go_get: github.com/coreos/go-systemd/v22@v22.5.0
