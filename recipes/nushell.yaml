# nushell 构建配方 (Rust 项目, 上游 nushell/nushell) —— musl 全静态
# 来自 debian.griffo.io 第三方源的迁移：我们从源码构建后发布到
# repo.freelamp.com。musl 全静态不依赖发行版 glibc，bookworm/trixie 通用。
repo: nushell/nushell
package: nushell
summary: "A new type of shell"
description: |
  A new type of shell
homepage: https://github.com/nushell/nushell
section: shells

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "0.115.1"
latest_tag: "0.115.1"
commit_hash: "798c55d19505fd52f205d7eb32a571b9d06ec9e6"
upstream_version: "0.115.1"

# musl 全静态构建（scripts/pkgs/rust-musl.sh，与 yazi/zoxide 同一套）
build_script: scripts/pkgs/rust-musl.sh
rust_bins:
  - nu
rust_package: nu

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
