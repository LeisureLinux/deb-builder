# goreleaser 构建配方 (第五批补齐)
repo: goreleaser/goreleaser
package: goreleaser
summary: "Deliver Go binaries as fast and easily as possible"
description: |
  Goreleaser builds, signs and publishes Go binaries to multiple targets with minimal configuration.
homepage: https://github.com/goreleaser/goreleaser
section: devel

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v2.19.0"
latest_tag: "v2.19.0"
commit_hash: "00139d15712716a3a2f21eb4d533f231ff19b9c5"
upstream_version: "2.19.0"

# Go 构建配置
ldflags: "-s -w"

# 构建入口（自动检测不可靠的显式指定）
build_path: "."

target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
