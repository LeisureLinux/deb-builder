# opensnitch 构建配方 (Phase 1 自动生成)
repo: evilsocket/opensnitch
package: opensnitch
summary: "GNU/Linux interactive application firewall"
description: |
  GNU/Linux interactive application firewall
  (Phase 1 auto-built for all architectures.)
homepage: https://github.com/evilsocket/opensnitch
section: net

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v1.8.0"
latest_tag: "v1.8.0"
commit_hash: "b404c4c6316760fa7bc415509d3f8d747f7dc9cc"
upstream_version: "1.8.0"

# Go 构建配置
ldflags: "-s -w"

# 全架构打包
target_arches:
  - amd64
  - arm64
  - loong64
  - riscv64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []

# netfilter 包自带 C 源码（queue.c），需要 cgo
cgo: true
# daemon/ui/protocol 的 gRPC 代码由 proto/ui.proto 生成，构建前先生成
pre_build: 'go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2 && go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1 && mkdir -p daemon/ui/protocol && cd proto && protoc -I. ui.proto --go_out=../daemon/ui/protocol/ --go-grpc_out=../daemon/ui/protocol/ --go_opt=paths=source_relative --go-grpc_opt=paths=source_relative && cd ../daemon && go get google.golang.org/grpc@latest google.golang.org/protobuf@latest google.golang.org/genproto@latest google.golang.org/genproto/googleapis/rpc@latest'

