# yq 构建配方 (第五批补齐)
repo: mikefarah/yq
package: yq
summary: "Lightweight and portable command-line YAML, JSON and XML processor"
description: |
  yq is a lightweight command-line YAML processor, portable and written in Go.
homepage: https://github.com/mikefarah/yq
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v4.54.1"
latest_tag: "v4.54.1"
commit_hash: "504fc38780cc46be8444ea1b72fb55919fc0bfb0"
upstream_version: "4.54.1"

# Go 构建配置
ldflags: "-s -w"
# amd64 编译内存峰值过高会被 OOM killer 静默击杀，限制并行度
build_env: "GOFLAGS=-p=1"

# 构建入口（自动检测不可靠的显式指定）
build_path: "./cmd"

target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
