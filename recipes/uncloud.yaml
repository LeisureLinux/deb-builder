# uncloud 构建配方 (Go 项目, 上游 psviderski/uncloud)
# 来自 debian.griffo.io 第三方源的迁移：上游发布，我们从源码构建后发布到
# repo.freelamp.com，避免依赖第三方源。Go 静态二进制（CGO_ENABLED=0），
# 不依赖发行版 glibc，bookworm/trixie 通用。
repo: psviderski/uncloud
package: uncloud
summary: "A lightweight tool for deploying and managing containerised apps across multiple machines"
description: |
  A lightweight tool for deploying and managing containerised apps across multiple machines
  Built from source by deb-builder and published to repo.freelamp.com.
  Statically linked Go binary (CGO disabled), works across Debian/Ubuntu releases.
homepage: https://github.com/psviderski/uncloud
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v0.20.0"
latest_tag: "v0.20.0"
commit_hash: "a5d73fe4d7b71259961b29dd1097d0aeb750261f"
upstream_version: "0.20.0"

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
