# git-lfs 构建配方 (第五批补齐)
repo: git-lfs/git-lfs
package: git-lfs
summary: "Git extension for versioning large files"
description: |
  Git Large File Storage (LFS) replaces large files with text pointers inside Git, while storing the file contents on a remote server.
homepage: https://github.com/git-lfs/git-lfs
section: vcs

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v3.8.0"
latest_tag: "v3.8.0"
commit_hash: "aece9221f8c09221a14395d964806b956289bc07"
upstream_version: "3.8.0"

# Go 构建配置
ldflags: "-s -w"

# 构建入口（自动检测不可靠的显式指定）
build_path: "."

target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
