# zellij 构建配方 (Rust 项目, 上游 zellij-org/zellij) —— musl 全静态
# 来自 debian.griffo.io 第三方源的迁移：我们从源码构建后发布到
# repo.freelamp.com。musl 全静态不依赖发行版 glibc，bookworm/trixie 通用。
repo: zellij-org/zellij
package: zellij
summary: "A terminal workspace with batteries included"
description: |
  A terminal workspace with batteries included
homepage: https://github.com/zellij-org/zellij
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "v0.45.1"
latest_tag: "v0.45.1"
commit_hash: "efd8fd5a89a20c07a111d248ad7fce53848d2c18"
upstream_version: "0.45.1"

# musl 全静态构建（scripts/pkgs/rust-musl.sh，与 yazi/zoxide 同一套）
build_script: scripts/pkgs/rust-musl.sh
rust_bins:
  - zellij

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
