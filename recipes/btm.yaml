# btm 构建配方 (Rust 项目, 上游 ClementTsang/bottom) —— musl 全静态
# 来自 debian.griffo.io 第三方源的迁移：我们从源码构建后发布到
# repo.freelamp.com。musl 全静态不依赖发行版 glibc，bookworm/trixie 通用。
repo: ClementTsang/bottom
package: btm
summary: "A cross-platform graphical process/system monitor"
description: |
  A cross-platform graphical process/system monitor
homepage: https://github.com/ClementTsang/bottom
section: utils

# 版本策略：锁定上游最新稳定 tag，并在 control 里记录 commit hash
version_tag: "0.14.9"
latest_tag: "0.14.9"
commit_hash: "e22236a928eeb876b2ccaad2f3d1ce5f6450281a"
upstream_version: "0.14.9"

# musl 全静态构建（scripts/pkgs/rust-musl.sh，与 yazi/zoxide 同一套）
build_script: scripts/pkgs/rust-musl.sh
rust_bins:
  - btm

# 打包架构：CI 每个架构一台原生 runner（amd64→x64, arm64→arm64）
target_arches:
  - amd64
  - arm64

maintainer: "LeisureLinux <albertxu@freelamp.com>"
depends: []
